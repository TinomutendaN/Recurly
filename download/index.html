<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recurrly for Android</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc;padding:16px;box-sizing:border-box}
  main{max-width:420px;text-align:center}

<main>
  <img src="icon.png" alt="Recurrly icon">

  <ol>
    <li>Tap the button and download the APK.</li>
